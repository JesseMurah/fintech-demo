spring:
  application:
    name: fintech-demo

  datasource:
    url: jdbc:h2:mem:fintechdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: always

app:
  openfga:
    api-url: http://localhost:8081

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 3600000

logging:
  level:
    com.example.fintech_demo: INFO
